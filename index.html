<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F2F7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MasteryCap" />
  <meta name="description" content="MasteryCap — offline personal institute. Software craft, market literacy, honest certificates." />
  <meta name="color-scheme" content="dark light" />
  <title>MasteryCap</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <!-- No font preload — LCP is Georgia boot shell (v5 §3d). -->
  <script>
  (function () {
    document.documentElement.classList.add('mc-booting');
    try {
      var ns = localStorage.getItem('masterycap_active_ns') || 'masterycap:';
      if (ns.charAt(ns.length - 1) !== ':') ns += ':';
      var raw = localStorage.getItem(ns + 'appearance');
      var mode = 'light';
      if (raw) mode = (JSON.parse(raw).mode) || 'light';
      if (mode === 'auto') {
        mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      if (mode !== 'light' && mode !== 'sepia' && mode !== 'dark') mode = 'light';
      // Colours come from css/design/tokens.css keyed on data-theme (HIG grouped backgrounds)
      document.documentElement.dataset.theme = mode;
      document.documentElement.dataset.mode = mode;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', { light: '#F2F2F7', sepia: '#ECE3D3', dark: '#000000' }[mode]);
    } catch (e) {}
  })();
  </script>
  <style>
    :root{--out:cubic-bezier(.22,1,.36,1)}
    html,body{margin:0;background:var(--bg);color:var(--t0);font-family:var(--sans);min-height:100%}
    #splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity .35s var(--out)}
    #splash.hide{opacity:0;pointer-events:none}
    .splash-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
    .splash-wordmark{font-family:var(--serif);font-size:clamp(28px,7vw,40px);font-weight:700;letter-spacing:-.02em;opacity:1}
    .splash-wordmark span{color:var(--acc)}
    .splash-tag,.splash-foot{opacity:1;color:var(--t3);font-size:13px;letter-spacing:.04em}
    .splash-foot{margin-top:28px}
    .splash-rule{width:48px;height:2px;background:var(--acc);opacity:.55;margin:4px 0}
    .onb-sub{font-size:15.5px;line-height:1.6;color:var(--t2);margin:0;max-width:30ch}
    .splash-bench{display:none}
  </style>
  <!-- Async app.css — welcome LCP fully inlined + mc-booting (51.10.10); 51.10.6 lacked that shell. -->
  <!-- HIG design: tokens render-blocking; legacy 51.x CSS sits in @layer legacy under the HIG components (css/cascade.css). -->
  <link rel="stylesheet" href="css/design/tokens.css?v=51120" />
  <link rel="stylesheet" href="css/cascade.css?v=51120" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="css/cascade.css?v=51120" />
  </noscript>
  <style>
    #splash { display: none !important; }
    html.mc-booting .screen,
    html.mc-booting #app-root .onb { animation: none !important; opacity: 1 !important; transform: none !important; }
    html.mc-booting body,
    html.mc-booting #app-root { font-family: system-ui, -apple-system, sans-serif !important; }
    html.mc-booting #app-root .onb-sub,
    html.mc-booting #app-root .onb-eyebrow { font-family: system-ui, -apple-system, sans-serif !important; }
    /* Welcome admission in HTML — LCP before module boot (v5 §3d). */
    #app-root .onb.admit-flow { min-height: 70vh; max-width: 520px; margin: 0 auto; padding: 0 24px 24px; box-sizing: border-box; display: flex; flex-direction: column; }
    #app-root .onb-top { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
    #app-root .onb-progress { flex: 1; height: 3px; background: var(--fill, rgba(0,0,0,.08)); border-radius: 99px; overflow: hidden; }
    #app-root .onb-progress i { display: block; height: 100%; width: 10%; background: var(--tint, #9A3412); }
    #app-root .onb-main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    #app-root .onb-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tint, #9A3412); margin-bottom: 10px; }
    #app-root .onb-title { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; margin: 0 0 12px; color: var(--label, #000); }
    #app-root .onb-sub { font-size: 17px; line-height: 1.45; color: var(--label-2, #3c3c43); margin: 0; max-width: 32ch; }
    #app-root .onb-foot { padding-top: 18px; }
    #app-root .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; padding: 0 22px; border-radius: 14px; font-weight: 600; font-size: 17px; border: none; cursor: pointer; }
    #app-root .btn.accent { background: var(--tint, #9A3412); color: var(--on-tint, #fff); }
    .cap-skip-link { position: absolute; left: -9999px; top: 0; }
    .cap-skip-link:focus, .cap-skip-link:focus-visible { left: 8px; top: 8px; z-index: 10000; padding: 10px 18px; background: var(--tint, #9A3412); color: var(--on-tint, #fff); font-weight: 700; text-decoration: none; border-radius: 999px; }
  </style>
</head>
<body>
  <a href="#app-root" class="cap-skip-link">Skip to content</a>
  <!-- film grain texture overlay -->
  <div id="grain" aria-hidden="true"></div>

  <!-- Splash kept in DOM for a11y tests but never shown -->
  <div id="splash" hidden aria-hidden="true"></div>

  <!-- Real contentful LCP (welcome admission) — preserved on first JS draw (v5 §3d). -->
  <div id="app-root" role="main" tabindex="-1">
    <div class="onb admit-flow" data-testid="admission-form">
      <div class="onb-top">
        <span style="width:34px"></span>
        <div class="onb-progress"><i></i></div>
        <span class="pill" style="font-size:11px;visibility:hidden" aria-hidden="true">Skip</span>
      </div>
      <div class="onb-main admit-main" data-mc-static-welcome>
        <div class="onb-eyebrow">MasteryCap Institute</div>
        <h1 class="onb-title">Application for admission</h1>
        <p class="onb-sub">A personal learning campus on this device. Software craft, markets literacy, and money systems — offline. No accounts. No income promises.</p>
      </div>
      <div class="onb-foot"><button type="button" class="btn accent" id="onbNext" data-testid="admission-next">Begin application</button></div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="tabbar hidden" id="tabbar"></nav>

  <script src="js/scroll-lock.js?v=51120"></script>
  <script type="module" src="js/app.js?v=51110"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          await navigator.serviceWorker.register('sw.js?v=51110');
        } catch (e) {}
      });
    }
  </script>
<script src="js/hig-dt.js"></script>
</body>
</html>
