<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F1E8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MasteryCap" />
  <meta name="description" content="MasteryCap — offline personal institute. Software craft, market literacy, honest certificates." />
  <meta name="color-scheme" content="dark light" />
  <title>MasteryCap</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <!-- No font preload — LCP is Georgia boot shell (v5 §3d). -->
  <style>
    :root{--bg:#141310;--t0:#F4F5F6;--t2:#878D95;--t3:#7A828C;--acc:#B45309;--out:cubic-bezier(.22,1,.36,1);--serif:'Fraunces',Georgia,serif;--sans:system-ui,-apple-system,sans-serif}
    html,body{margin:0;background:var(--bg);color:var(--t0);font-family:var(--sans);min-height:100%}
    #splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity .35s var(--out)}
    #splash.hide{opacity:0;pointer-events:none}
    .splash-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
    .splash-wordmark{font-family:var(--serif);font-size:clamp(28px,7vw,40px);font-weight:700;letter-spacing:-.02em;opacity:1}
    .splash-wordmark span{color:var(--acc)}
    .splash-tag,.splash-foot{opacity:1;color:var(--t3);font-size:13px;letter-spacing:.04em}
    .splash-foot{margin-top:28px}
    .splash-rule{width:48px;height:2px;background:var(--acc);opacity:.55;margin:4px 0}
    .onb-sub{font-size:15.5px;line-height:1.6;color:var(--t2);margin:0;max-width:30ch}
    .splash-bench{display:none}
  </style>
  <!-- Blocking CSS — async sheets delayed LCP to ~4s on mobile (v5 §3b). -->
  <link rel="stylesheet" href="css/app.css?v=51105" />
  <!-- Institute sheet after first paint — cold LCP is app.css + boot shell (v5 §3d). -->
  <link rel="stylesheet" href="css/institute.css?v=51105" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="css/institute.css?v=51105" /></noscript>
  <style>
    #splash { display: none !important; }
    .mc-boot-shell { min-height: 60vh; padding: 40px 24px 24px; box-sizing: border-box; }
    .mc-boot-shell h1 {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--t0, #F4F5F6);
    }
    .mc-boot-shell h1 span { color: var(--acc, #B45309); }
    .mc-boot-shell p {
      margin: 10px 0 0;
      font-size: 15px;
      line-height: 1.55;
      color: var(--t2, #878D95);
      max-width: 32ch;
    }
  </style>
</head>
<body>
  <a href="#app-root" class="cap-skip-link">Skip to content</a>
  <!-- film grain texture overlay -->
  <div id="grain" aria-hidden="true"></div>

  <!-- Splash kept in DOM for a11y tests but never shown -->
  <div id="splash" hidden aria-hidden="true"></div>

  <!-- Real contentful LCP shell (not :empty pseudo) until module boot -->
  <div id="app-root" role="main" tabindex="-1">
    <div class="mc-boot-shell">
      <h1>Mastery<span>Cap</span></h1>
      <p>Personal learning campus — Admission · Branches · Craft</p>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="tabbar hidden" id="tabbar"></nav>

  <script type="module" src="js/app.js?v=51105"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          await navigator.serviceWorker.register('sw.js?v=51105');
        } catch (e) {}
      });
    }
  </script>
</body>
</html>
