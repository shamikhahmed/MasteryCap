<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F1E8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MasteryCap" />
  <meta name="description" content="MasteryCap — offline personal institute. Software craft, market literacy, honest certificates." />
  <meta name="color-scheme" content="dark light" />
  <title>MasteryCap</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <link rel="preload" href="fonts/geistmono-500.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Critical splash + onboarding LCP (v5 §3) — full sheets load async below. -->
  <style>
    :root{--bg:#141310;--t0:#F4F5F6;--t2:#878D95;--t3:#7A828C;--acc:#B45309;--out:cubic-bezier(.22,1,.36,1);--serif:'Fraunces',Georgia,serif;--sans:system-ui,-apple-system,sans-serif}
    html,body{margin:0;background:var(--bg);color:var(--t0);font-family:var(--sans);min-height:100%}
    #splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity .35s var(--out)}
    #splash.hide{opacity:0;pointer-events:none}
    .splash-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
    .splash-wordmark{font-family:var(--serif);font-size:clamp(28px,7vw,40px);font-weight:700;letter-spacing:-.02em;opacity:1}
    .splash-wordmark span{color:var(--acc)}
    .splash-tag,.splash-foot{opacity:1;color:var(--t3);font-size:13px;letter-spacing:.04em}
    .splash-foot{margin-top:28px}
    .splash-rule{width:48px;height:2px;background:var(--acc);opacity:.55;margin:4px 0}
    .onb-sub{font-size:15.5px;line-height:1.6;color:var(--t2);margin:0;max-width:30ch}
    .splash-bench{display:none}
  </style>
  <!-- Blocking CSS — async sheets delayed LCP to ~4s on mobile (v5 §3b). -->
  <link rel="stylesheet" href="css/app.css?v=51103" />
  <link rel="stylesheet" href="css/institute.css?v=51103" />
  <script>
  /* Skip splash chrome for returning / demo — LCP is real campus content. */
  (function () {
    try {
      var demo = /(?:^|[?&])demo=1(?:&|$)/.test(location.search);
      var raw = localStorage.getItem('masterycap:onboarded');
      var onboarded = raw === 'true' || raw === '1' || raw === '"true"';
      if (demo || onboarded) document.documentElement.classList.add('mc-skip-splash');
    } catch (e) {}
  })();
  </script>
  <style>
    html.mc-skip-splash #splash { display: none !important; }
    /* Contentful first-paint shell before module boot (LCP). */
    #app-root:empty::before {
      content: 'MasteryCap';
      display: block;
      font-family: var(--serif), Georgia, serif;
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 700;
      letter-spacing: -.02em;
      padding: 48px 24px 8px;
      color: var(--t0, #F4F5F6);
    }
    #app-root:empty::after {
      content: 'Personal learning campus';
      display: block;
      font-size: 15px;
      color: var(--t2, #878D95);
      padding: 0 24px 24px;
      max-width: 30ch;
    }
    html.mc-skip-splash #app-root:empty { min-height: 50vh; }
  </style>
</head>
<body>
  <a href="#app-root" class="cap-skip-link">Skip to content</a>
  <!-- film grain texture overlay -->
  <div id="grain" aria-hidden="true"></div>

  <!-- Splash -->
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-bench" aria-hidden="true">
        <div class="bench-leg bench-leg-l"></div>
        <div class="bench-leg bench-leg-r"></div>
        <div class="bench-top"></div>
        <div class="bench-peg"></div>
        <div class="splash-stamp">Ready</div>
      </div>
      <div class="splash-wordmark">Mastery<span>Cap</span></div>
      <div class="splash-rule" aria-hidden="true"></div>
      <div class="splash-tag">Personal learning campus</div>
    </div>
    <div class="splash-foot">Admission · Branches · Craft</div>
  </div>

  <!-- App -->
  <div id="app-root" role="main" tabindex="-1"></div>

  <!-- Bottom nav -->
  <nav class="tabbar hidden" id="tabbar"></nav>

  <script type="module" src="js/app.js?v=51103"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          // Always re-register so CACHE bump in sw.js takes effect
          await navigator.serviceWorker.register('sw.js?v=51103');
        } catch (e) {}
      });
    }
  </script>
</body>
</html>
